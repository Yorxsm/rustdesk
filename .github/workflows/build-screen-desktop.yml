name: Screen desktop build

# Unsigned Windows x64 and macOS (Intel + Apple Silicon) Flutter packages.
# Does not call flutter-build.yml and does not require signing secrets.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to create or update
        required: false
        default: "0.1.0"
  push:
    tags:
      - 'desktop-v[0-9]+.[0-9]+.[0-9]+'
      - 'desktop-[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
  VERSION: "1.5.3"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  LLVM_VERSION: "15.0.6"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"

jobs:
  bridge:
    name: bridge ${{ matrix.job.flutter-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              os: ubuntu-22.04,
              target: x86_64-unknown-linux-gnu,
              flutter-version: "3.22.3",
              artifact-name: bridge-artifact,
            }
          - {
              os: ubuntu-22.04,
              target: x86_64-unknown-linux-gnu,
              flutter-version: "3.44.8",
              artifact-name: bridge-artifact-flutter-3.44,
            }
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc git g++ libclang-dev libgtk-3-dev \
            llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.75"
          targets: ${{ matrix.job.target }}
          components: rustfmt

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ matrix.job.flutter-version }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          if [[ "${{ matrix.job.flutter-version }}" == "3.22.3" ]]; then
            sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          else
            bash .github/patches/apply_flutter_3.44_source_patches.sh
          fi
          pushd flutter && flutter pub get && popd

      - name: Install rustfmt
        run: rustup component add rustfmt --toolchain 1.75-x86_64-unknown-linux-gnu

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.job.artifact-name }}
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  windows:
    name: windows x64
    needs: bridge
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: "3.24.5"
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-3.24.5-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.75"
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Install rustfmt
        run: rustup component add rustfmt --toolchain 1.75-x86_64-pc-windows-msvc

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" -print -exec cat {} \;
            exit 1
          fi

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
            Expand-Archive usbmmidd_v2.zip -DestinationPath .
            Remove-Item -Path usbmmidd_v2\Win32 -Recurse -ErrorAction SilentlyContinue
            Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat" -ErrorAction SilentlyContinue
            mv -Force .\usbmmidd_v2 ./rustdesk
          } catch {
            Write-Host "Ignoring virtual display driver download: $_"
          }

      - name: Zip Windows build
        shell: bash
        run: |
          mkdir -p dist
          tar -acf "dist/screen-windows-x64.zip" -C rustdesk .

      - name: Upload Windows zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screen-desktop-windows-x64-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Build portable exe
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mv ./target/release/rustdesk-portable-packer.exe "dist/screen-windows-x64.exe"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName "../../dist/screen-windows-x64.msi"
          popd

      - name: Upload Windows installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screen-desktop-windows-x64-installers
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: error

  macos:
    name: macos ${{ matrix.arch }}
    needs: bridge
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: macos-26-intel
            target: x86_64-apple-darwin
            flutter: "3.24.5"
            bridge: bridge-artifact
            extra: ""
            vcpkg_triplet: ""
            cargo_target: ""
            mac_arch: ""
          - arch: aarch64
            # Hosted arm64 images never started: macos-14 is unsupported, and
            # macos-15/macos-26 were cancelled with no runner. Cross-build here.
            os: macos-26-intel
            target: aarch64-apple-darwin
            flutter: "3.44.9"
            bridge: bridge-artifact-flutter-3.44
            extra: "--screencapturekit"
            vcpkg_triplet: arm64-osx
            cargo_target: aarch64-apple-darwin
            mac_arch: arm64
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install build runtime
        run: |
          brew install llvm
          if ! command -v pkg-config &>/dev/null; then
            brew install pkg-config
          fi

      - name: Install NASM
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}

      - name: Keep CocoaPods for Flutter 3.44
        if: matrix.arch == 'aarch64'
        run: flutter config --no-enable-swift-package-manager

      - name: Patch flutter
        if: matrix.arch == 'x86_64'
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch RustDesk sources for Flutter 3.44
        if: matrix.arch == 'aarch64'
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.81"
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Install rustfmt
        run: rustup component add rustfmt --toolchain 1.81-${{ matrix.target }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.bridge }}
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
        run: |
          triplet_args=()
          if [ -n "$VCPKG_TRIPLET" ]; then
            triplet_args+=(--triplet "$VCPKG_TRIPLET")
          fi
          if ! $VCPKG_ROOT/vcpkg install "${triplet_args[@]}" --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" -print -exec cat {} \;
            exit 1
          fi
          # ffmpeg is a host port, so an Intel runner installs it for x64-osx.
          # The arm64 compile looks in installed/arm64-osx/include.
          if [ "$VCPKG_TRIPLET" = "arm64-osx" ]; then
            if ! (cd /tmp && "$VCPKG_ROOT/vcpkg" install "ffmpeg:arm64-osx" \
              --overlay-ports "$GITHUB_WORKSPACE/res/vcpkg" \
              --overlay-triplets "$GITHUB_WORKSPACE/res/vcpkg-triplets" \
              --x-install-root "$VCPKG_ROOT/installed"); then
              find "${VCPKG_ROOT}/" -name "*.log" -print -exec cat {} \;
              exit 1
            fi
          fi

      - name: Build rustdesk
        env:
          MAC_CARGO_TARGET: ${{ matrix.cargo_target }}
          MAC_BUILD_ARCH: ${{ matrix.mac_arch }}
          VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
        run: |
          if [ -n "$MAC_CARGO_TARGET" ]; then
            export PKG_CONFIG_ALLOW_CROSS=1
            export PKG_CONFIG_PATH="$VCPKG_ROOT/installed/${VCPKG_TRIPLET}/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          fi
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.extra }}

      - name: Sign app and zip it
        shell: bash
        run: |
          set -euo pipefail
          SRC_APP="./flutter/build/macos/Build/Products/Release/RustDesk.app"
          test -d "$SRC_APP"
          STAGE="${RUNNER_TEMP}/screen-dmg-stage"
          APP="${STAGE}/RustDesk.app"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto "$SRC_APP" "$APP"
          xattr -cr "$APP"
          # --deep skips some nested bundles on current macOS, so sign those first.
          while IFS= read -r -d '' lib; do
            codesign --force --sign - "$lib"
          done < <(find "$APP" -type f \( -name '*.dylib' -o -name '*.so' \) -print0)
          while IFS= read -r -d '' bundle; do
            codesign --force --sign - "$bundle"
          done < <(find "$APP" -depth -type d \( -name '*.framework' -o -name '*.xpc' -o -name '*.app' \) ! -path "$APP" -print0)
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          mkdir -p dist
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            MAC_DIST=screen-mac-apple-silicon
          else
            MAC_DIST=screen-mac-intel
          fi
          echo "MAC_DIST=$MAC_DIST" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${MAC_DIST}.zip"
          ln -s /Applications "${STAGE}/Applications"

      - name: Upload macOS zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screen-desktop-macos-${{ matrix.arch }}-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Create and verify dmg
        shell: bash
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/screen-dmg-stage"
          test -d "${STAGE}/RustDesk.app"
          test -L "${STAGE}/Applications"
          KB=$(du -sk "$STAGE" | awk '{print $1}')
          MB=$(( KB / 1024 + KB / 1024 / 5 + 64 ))
          DMG="dist/${MAC_DIST}.dmg"
          hdiutil create \
            -volname screen \
            -srcfolder "$STAGE" \
            -fs HFS+ \
            -format UDZO \
            -imagekey zlib-level=9 \
            -size "${MB}m" \
            -ov \
            "$DMG"
          hdiutil verify "$DMG"
          MNT="${RUNNER_TEMP}/screen-dmg-mount"
          rm -rf "$MNT"
          mkdir -p "$MNT"
          cleanup() {
            hdiutil detach "$MNT" >/dev/null 2>&1 || hdiutil detach -force "$MNT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          test -d "$MNT/RustDesk.app/Contents/MacOS"
          test -L "$MNT/Applications"
          hdiutil detach "$MNT"
          trap - EXIT

      - name: Upload macOS dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screen-desktop-macos-${{ matrix.arch }}-dmg
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    name: publish release
    needs: [windows, macos]
    if: always() && !cancelled() && needs.windows.result != 'skipped' && needs.macos.result != 'skipped'
    runs-on: ubuntu-22.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: screen-desktop-*
          path: dist
          merge-multiple: true

      - name: Show packages
        run: ls -l dist

      - name: Publish Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: false
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: dist/*
